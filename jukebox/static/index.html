<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Jukebox</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">♫</span> AI Jukebox</div>
    <div id="banner" class="banner" hidden></div>
  </header>

  <main class="layout">
    <section class="library-panel">
      <div class="section-head">
        <h2>Library <span id="track-count" class="muted"></span></h2>
        <button id="play-all" class="btn primary">▶ Play all</button>
      </div>
      <div id="library" class="grid" aria-live="polite"></div>
    </section>

    <aside class="side">
      <section class="card">
        <h2>Create a song</h2>
        <form id="gen-form">
          <label>Style
            <input id="style" list="style-list" required maxlength="80" placeholder="e.g. Synthwave">
            <datalist id="style-list"></datalist>
          </label>
          <label>Mood
            <input id="mood" list="mood-list" required maxlength="80" placeholder="e.g. Dreamy">
            <datalist id="mood-list"></datalist>
          </label>
          <label>Theme <span class="muted">(optional)</span>
            <input id="theme" maxlength="300" placeholder="e.g. a midnight drive along the coast">
          </label>
          <label>Duration: <strong id="duration-out">60 s</strong>
            <input id="duration" type="range" min="15" max="240" step="5" value="60">
          </label>
          <fieldset class="seg">
            <legend>Track type</legend>
            <label><input type="radio" name="kind" value="vocal" checked> Vocal (AI lyrics)</label>
            <label><input type="radio" name="kind" value="instrumental"> Instrumental</label>
          </fieldset>
          <label id="lang-row">Lyrics language
            <select id="language"></select>
          </label>
          <button id="gen-btn" class="btn primary wide" type="submit">✨ Generate song + cover</button>
          <p id="gen-error" class="error" role="alert" hidden></p>
        </form>
      </section>

      <section class="card">
        <h2>Generation status</h2>
        <div id="jobs"><p class="muted">No songs in progress.</p></div>
      </section>

      <section class="card">
        <h2>AI DJ</h2>
        <label class="switch"><input id="dj-on" type="checkbox" checked> DJ commentary between songs</label>
        <label>DJ name <input id="dj-name" maxlength="40" value="DJ Nova"></label>
        <div class="voice">
          <div>Voice: <strong id="voice-status">Default voice</strong></div>
          <label class="btn small">Upload MP3/WAV
            <input id="voice-file" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav" hidden>
          </label>
          <button id="voice-clear" class="btn small ghost" hidden>Use default</button>
          <p class="muted tiny">10–20 s of clear speech works best. Stored only on this server for your session, never shared.</p>
          <p id="voice-error" class="error" role="alert" hidden></p>
        </div>
      </section>
    </aside>
  </main>

  <section class="queue-panel" id="queue-panel" hidden>
    <div class="section-head"><h2>Up next</h2><button id="queue-clear" class="btn small ghost">Clear</button></div>
    <ol id="queue"></ol>
  </section>

  <footer class="player">
    <img id="np-cover" class="np-cover" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    <div class="np">
      <div id="np-title" class="np-title">Nothing playing</div>
      <div id="np-sub" class="np-sub muted">Press play to start the library</div>
      <div class="progress"><span id="t-cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="t-dur">0:00</span></div>
    </div>
    <div class="controls">
      <button id="btn-play" class="round" aria-label="Play">▶</button>
      <button id="btn-skip" class="round ghost" aria-label="Skip">⏭</button>
      <button id="btn-queue" class="btn small ghost" aria-label="Show queue">Queue <span id="queue-count">0</span></button>
    </div>
    <audio id="audio" preload="auto"></audio>
  </footer>

  <dialog id="lyrics-dlg">
    <h3 id="lyrics-title"></h3>
    <p id="lyrics-meta" class="muted"></p>
    <pre id="lyrics-body"></pre>
    <form method="dialog"><button class="btn">Close</button></form>
  </dialog>

  <div id="toasts" aria-live="assertive"></div>
  <script src="/static/app.js"></script>
</body>
</html>
