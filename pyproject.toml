[project]
name = "ai-jukebox"
version = "0.1.0"
description = "AI Jukebox: generated songs, FLUX cover art and a spoken AI DJ between tracks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-jukebox = "jukebox.app:main"

[dependency-groups]
dev = [
    "playwright==1.63.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jukebox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real class services (needs CLASS_API_KEY); run with -m live"]
addopts = "-m 'not live'"
pythonpath = ["tests"]
